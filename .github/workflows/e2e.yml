# End-to-end checks: serve the app with `bynk dev` and run e2e/scenarios.sh
# against it.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""
  # bynk-canary.yml calls this at each new Bynk release, so the scenarios
  # also run against releases newer than the baseline.
  workflow_call:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scenarios:
    name: Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bynk-lang/bynk-dev@v1
        with:
          # Pushes and pull requests use BYNK_VERSION, so a red build means
          # your change broke it. The canary passes newer releases in, and
          # proposes moving BYNK_VERSION once one passes.
          version: ${{ inputs.version }}
          version-file: ${{ !inputs.version && 'BYNK_VERSION' || '' }}
          # Secrets, cron and several contexts: see the recipes at the foot of
          # e2e/scenarios.sh. A secret goes here as
          #   wrangler-args: --var NAME:${{ env.NAME }}
          # with NAME set in the job's `env`.
          run: ./e2e/scenarios.sh
